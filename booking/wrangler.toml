# SOLAR CAR 37 booking server (Cloudflare Worker). Setup: docs/RESERVATION.md
#   cd booking && npx wrangler deploy
# Secrets (never in this file): npx wrangler secret put CALENDARS_BUSY
#                               npx wrangler secret put GOOGLE_SERVICE_ACCOUNT
#                               npx wrangler secret put STRIPE_SECRET_KEY
#                               npx wrangler secret put STRIPE_WEBHOOK_SECRET
#                               npx wrangler secret put RESEND_API_KEY
#                               npx wrangler secret put STATS_KEY   (key of the statistics page)
#                               npx wrangler secret put GOOGLE_OAUTH_CLIENT_ID      (fiche Google robot,
#                               npx wrangler secret put GOOGLE_OAUTH_CLIENT_SECRET   docs/FICHE-GOOGLE-AUTO.md)
name = "solarcar37-reservation"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

# visit statistics (booking/stats.js, docs/STATISTIQUES.md): one Durable Object with its own SQLite
# database (free plan: SQLite-backed Durable Objects only)
[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Stats"]

# the Google Business Profile robot (booking/fiche-google.js): Google sign-in, photos sent
[[durable_objects.bindings]]
name = "FICHE"
class_name = "Fiche"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Fiche"]

# the statistics e-mail, on the 1st of each month at 7:00 UTC (8:00 or 9:00 in Paris); the photo of
# the week on the Google Business Profile, every Tuesday at 8:17 UTC (FICHE_CRON in booking/fiche-google.js)
[triggers]
crons = ["0 7 1 * *", "17 8 * * 2"]

# the fonts of the statistics page (booking/stats-fonts.js), uploaded as binary modules
[[rules]]
type = "Data"
globs = ["**/*.woff2"]
fallthrough = true

[vars]
# the sites allowed to call the API (production and the GitHub Pages preview)
ALLOWED_ORIGINS = "https://www.solarcar37.fr,https://solarcar37.fr,https://kerozenyt.github.io"
# visits from these sites are counted apart ("Aperçu" on the statistics page): the GitHub preview
STATS_PREVIEW_ORIGINS = "https://kerozenyt.github.io"
# the statistics page (link of the monthly e-mail, booking/stats-report.js)
STATS_PAGE = "https://solarcar37-reservation.contact-solarcar37.workers.dev/stats"
# appointments are written here (SOLAR CAR 37)
CALENDAR_WRITE = "contact.solarcar37@gmail.com"
# a slot is free only if all the calendars of CALENDARS_BUSY are free: SOLAR CAR 37, SOLAR HOME
# 37 and PERSO. Stored as a secret (the PERSO calendar id stays private):
#   npx wrangler secret put CALENDARS_BUSY
#   contact.solarcar37@gmail.com,contact.solarhome37@gmail.com,<id of the PERSO calendar>

# e-mails of a confirmed booking (booking/mail.js, Resend): « Nouveau RDV » to the workshop
NOTIFY_TO = "contact.solarcar37@gmail.com"
# the sender: Resend's test sender until solarcar37.fr is verified in Resend (it can only write
# to the Resend account's own address), then "SOLAR CAR 37 <reservation@solarcar37.fr>"
MAIL_FROM = "SOLAR CAR 37 <onboarding@resend.dev>"
# "1": the client gets the confirmation too (needs the verified domain)
MAIL_CLIENTS = "0"
# where the links of the e-mails lead (the preview until the site is on solarcar37.fr)
SITE_URL = "https://kerozenyt.github.io/Site-Solar-Car"
# the Google Business Profile robot e-mails each photo sent ("tout") or only its problems ("erreurs")
FICHE_MAILS = "tout"

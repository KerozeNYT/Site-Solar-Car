# Aperçu en ligne : à chaque push, le site est construit pour être servi depuis
# https://<compte>.github.io/<dépôt>/ et publié sur la branche gh-pages.
# Réglage à faire une seule fois : Settings > Pages > Source « Deploy from a branch »,
# branche « gh-pages », dossier « / (root) ».
# L'aperçu est marqué « noindex » : il ne sera pas référencé par les moteurs de recherche.
name: Aperçu GitHub Pages

on:
  push:
    branches: [claude/solar-car-37-website-ib2326, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apercu-pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      # actions pinned to a commit (a moved tag cannot change what runs here); Dependabot
      # (.github/dependabot.yml) proposes the updates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the publish step below uses its own token: none left in .git for the build scripts
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # known vulnerabilities in what the site ships (shown in the run, never blocks the preview)
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - name: Construire le site (sous-dossier du dépôt, aperçu non indexé)
        run: npm run build
        env:
          SITE_BASE: /${{ github.event.repository.name }}/
          PREVIEW: '1'
      - name: Publier sur la branche gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Aperçu ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
